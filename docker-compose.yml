version: '3.8'

services:
  openshare:
    image: thisisjoyjacob/openshare:latest
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/usr/src/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
